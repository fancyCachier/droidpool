<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>droidpool 设备墙</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#272b35;--fg:#e6e8ee;--dim:#8b93a7;
      --ok:#3fb950;--busy:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 18px;
       border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:600}
.node{color:var(--dim);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.node b{color:var(--fg);font-weight:600}
.warn{color:var(--bad)}
.grid{display:grid;gap:14px;padding:16px;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
      cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card.human{border-color:var(--busy);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(210,153,34,.5)}50%{box-shadow:0 0 0 6px rgba(210,153,34,0)}}
.shot{width:100%;aspect-ratio:1366/768;object-fit:cover;background:#000;display:block}
.shot.dead{opacity:.35;filter:grayscale(.6)}
.meta{padding:9px 11px;font-size:12px}
.row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.s-ready .dot{background:var(--ok)} .s-leased .dot{background:var(--busy)}
.s-broken .dot{background:var(--bad)} .s-creating .dot,.s-resetting .dot{background:var(--acc)}
.id{font-weight:600}
.state{color:var(--dim);margin-left:auto;font-size:11px}
.sub{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;background:#21262d;border-radius:4px;padding:0 5px;margin-right:5px;color:var(--fg)}
.empty{padding:60px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>droidpool 设备墙</h1>
  <div class="node" id="node">读取中…</div>
  <label style="margin-left:auto;color:var(--dim);font-size:12px">
    刷新 <select id="fps"><option value="0">暂停</option><option value="3000">3s</option>
    <option value="2000" selected>2s</option><option value="1000">1s</option></select>
  </label>
</header>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>池中没有设备</div>

<script>
const $ = s => document.querySelector(s);
let shotTimer = null, devices = [];

function fmtLeft(iso){
  if(!iso) return '';
  const ms = new Date(iso) - Date.now();
  if(ms <= 0) return '已到期';
  const m = Math.floor(ms/60000);
  return m >= 60 ? `剩 ${Math.floor(m/60)}h${m%60}m` : `剩 ${m}m`;
}

// 卡片只建一次，之后原地更新文字。整块重建会销毁 <img>，
// 已加载的画面随之丢失 → 黑屏闪烁。
const cards = new Map();

function makeCard(d){
  const el = document.createElement('div');
  el.innerHTML = `
    <img class="shot" alt="" data-id="${d.id}">
    <div class="meta">
      <div class="row1"><span class="dot"></span><span class="id"></span>
        <span class="state"></span></div>
      <div class="sub line1"></div>
      <div class="sub line2"></div>
      <div class="sub warn line3" hidden></div>
    </div>`;
  el.onclick = () => location.href = `/device/${encodeURIComponent(d.id)}`;
  return el;
}

function updateCard(el, d){
  el.className = `card s-${d.state}` + (d.human ? ' human' : '');
  el.querySelector('.id').textContent = d.id;
  el.querySelector('.state').textContent = d.state;
  const l1 = el.querySelector('.line1');
  if(d.worktree){
    l1.innerHTML = `<span class="tag"></span><span class="br"></span>`;
    l1.querySelector('.tag').textContent = d.worktree;
    l1.querySelector('.br').textContent = `${d.branch||''} ${d.head_sha||''}`;
  } else {
    l1.innerHTML = '<span style="opacity:.6">空闲</span>';
  }
  el.querySelector('.line2').textContent =
    d.owner ? `${d.owner} · ${fmtLeft(d.expires_at)}` : d.adb_addr;
  const l3 = el.querySelector('.line3');
  l3.hidden = !d.human;
  if(d.human) l3.textContent = `⚠ 人工接管中 ${d.note||''}`;
}

function applySnapshot(j){
  if(!j || j.error) return;
  devices = j.devices || [];
    $('#empty').hidden = devices.length > 0;
    const n = j.node;
    $('#node').innerHTML = n
      ? `<span>内存 <b>${n.MemAvailMiB}</b>/${n.MemTotalMiB} MiB 可用</span>
         <span>swap <b>${n.SwapUsedMiB}</b> MiB</span>
         <span>温度 <b>${n.TempC.toFixed(1)}</b>°C</span>
         <span>负载 <b>${n.Load1}</b></span>
         ${j.under_pressure?'<span class="warn">内存不足，暂不接受新租约</span>':''}`
      : '<span>节点数据不可用</span>';
  reconcile();
}

// 实时通道：状态变更立刻到，不必等下一次轮询。
// 画面仍走 HTTP 拉取——图是二进制，塞进 SSE 要 base64 膨胀三分之一。
let es = null, pollTimer = null;
function connectSSE(){
  es = new EventSource('/api/events');
  es.onmessage = e => { try{ applySnapshot(JSON.parse(e.data).data); }catch(_){} };
  ['snapshot','tick','claim','release','human','reap'].forEach(k =>
    es.addEventListener(k, e => {
      try{
        const ev = JSON.parse(e.data);
        applySnapshot(ev.data);
        if(k === 'reap') toast(`watchdog 回收了 ${ev.data && ''}设备（${(ev.data&&ev.data.reason)||''}）`);
      }catch(_){}
    }));
  es.onerror = () => {
    $('#node').innerHTML = '<span class="warn">实时通道断开，改用轮询…</span>';
    // EventSource 自己会重连；同时兜一层轮询，避免代理不透传 SSE 时整页不更新
    if(!pollTimer) pollTimer = setInterval(fallbackPoll, 5000);
  };
  es.onopen = () => { if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } };
}
async function fallbackPoll(){
  try{ applySnapshot(await (await fetch('/api/wall')).json()); }catch(_){}
}
function toast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;right:16px;bottom:16px;background:#181b22;border:1px solid #58a6ff;'
    + 'border-radius:6px;padding:8px 12px;font-size:13px;z-index:99';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// 只增删变化的卡片，其余原地更新
function reconcile(){
  const g = $('#grid'), seen = new Set();
  for(const d of devices){
    seen.add(d.id);
    let el = cards.get(d.id);
    if(!el){
      el = makeCard(d);
      cards.set(d.id, el);
      g.appendChild(el);
      loadShot(el.querySelector('img.shot'));  // 新卡片立刻取一次图
    }
    updateCard(el, d);
  }
  for(const [id, el] of cards){
    if(!seen.has(id)){ el.remove(); cards.delete(id); }
  }
}

// 先把新图解码完再替换 src，避免换图瞬间的空白帧
async function loadShot(img){
  if(!img || img.dataset.busy) return;
  img.dataset.busy = '1';
  try{
    const r = await fetch(`/api/devices/${encodeURIComponent(img.dataset.id)}/screenshot.jpg?w=420&t=${Date.now()}`);
    if(!r.ok) throw new Error(r.status);
    const url = URL.createObjectURL(await r.blob());
    const next = new Image();
    next.src = url;
    await next.decode();          // 解码完成才换，杜绝闪烁
    const old = img.src;
    img.src = url;
    img.classList.remove('dead');
    if(old.startsWith('blob:')) URL.revokeObjectURL(old);
  }catch(e){
    img.classList.add('dead');    // 保留上一帧画面，只是压暗
  }finally{
    delete img.dataset.busy;
  }
}

function refreshShots(){
  document.querySelectorAll('img.shot').forEach(loadShot);
}

function schedule(){
  if(shotTimer) clearInterval(shotTimer);
  const ms = +$('#fps').value;
  if(ms) shotTimer = setInterval(refreshShots, ms);
}
$('#fps').onchange = schedule;

connectSSE(); schedule();
</script>
</body>
</html>
