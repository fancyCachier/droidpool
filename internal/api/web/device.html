<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>droidpool 设备</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#272b35;--fg:#e6e8ee;--dim:#8b93a7;
      --ok:#3fb950;--busy:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
a.back{color:var(--acc);text-decoration:none}
h1{font-size:15px;margin:0;font-weight:600}
.live{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}
.live.on .dot{background:var(--ok)}
.wrap{display:flex;gap:18px;padding:16px;align-items:flex-start;flex-wrap:wrap}
.screen{position:relative;background:#000;border:1px solid var(--line);border-radius:8px;
        overflow:hidden;line-height:0;flex:1 1 640px;min-width:320px;max-width:1366px}
canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:none;user-select:none}
.side{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.panel h2{font-size:12px;margin:0 0 9px;color:var(--dim);font-weight:600;letter-spacing:.04em}
button{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:6px;
       padding:7px 10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;
       justify-content:center;gap:5px}
button:hover{border-color:var(--acc);background:#262c36}
button:active{transform:scale(.95);border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
button.warn{border-color:var(--busy);color:var(--busy)}
button svg{width:16px;height:16px;flex:none}
/* 三大金刚独占第一行 */
.nav3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:7px}
.nav3 button{padding:9px 0}
.keys2{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.dpad{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);
      gap:5px;justify-content:center;margin-top:9px}
.dpad button{padding:0}
.dpad .sp{visibility:hidden}
input[type=text]{background:#0d1117;border:1px solid var(--line);color:var(--fg);
                 border-radius:6px;padding:7px 9px;width:100%}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
dt{color:var(--dim)} dd{margin:0;word-break:break-all}
.hint{color:var(--dim);font-size:12px;margin-top:7px;line-height:1.45}
.fps{font-size:11px;color:var(--dim);margin-left:6px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         background:#000;color:var(--dim);font-size:14px;line-height:1.5;pointer-events:none}
canvas:focus{outline:2px solid var(--acc);outline-offset:-2px}
pre.clip{margin:0 0 8px;padding:8px 9px;background:#0d1117;border:1px solid var(--line);border-radius:6px;
         font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--fg);max-height:80px;overflow:auto;
         white-space:pre-wrap;word-break:break-all}
#flash{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid var(--acc);
       border-radius:6px;padding:8px 12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#flash.show{opacity:1}
#flash.err{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 设备墙</a>
  <h1 id="title">…</h1>
  <span class="live" id="live"><span class="dot"></span><span class="txt">连接中</span></span>
  <span class="fps" id="fpsnow"></span>
</header>

<div class="wrap">
  <div class="screen"><canvas id="cv" width="1366" height="768" tabindex="0"></canvas><div id="loading">连接中…</div></div>
  <div class="side">
    <div class="panel">
      <h2>租约</h2>
      <dl id="info"><dt>加载中</dt><dd></dd></dl>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button id="takeover" class="warn">接管</button>
        <button id="release">强制释放</button>
      </div>
    </div>

    <div class="panel">
      <h2>控制</h2>
      <div class="nav3">
        <button data-key="back" title="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          返回</button>
        <button data-key="home" title="主页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          主页</button>
        <button data-key="apps" title="任务">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          任务</button>
      </div>
      <div class="keys2">
        <button data-key="enter" title="回车">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="m9 10-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg></button>
        <button data-key="del" title="退格">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2"/><path d="m18 9-6 6"/><path d="m12 9 6 6"/></svg></button>
        <button data-key="volup" title="音量+">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg></button>
        <button data-key="voldn" title="音量-">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/></svg></button>
      </div>
      <div class="dpad">
        <span class="sp"></span>
        <button data-key="up" title="上">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
        <span class="sp"></span>
        <button data-key="left" title="左">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <button data-key="power" title="电源">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></button>
        <button data-key="right" title="右">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        <span class="sp"></span>
        <button data-key="down" title="下">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <span class="sp"></span>
      </div>
    </div>

    <div class="panel">
      <h2>截图</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="snap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>
          保存 PNG</button>
        <button id="copy">复制到剪贴板</button>
      </div>
      <div class="hint">保存当前这一帧的原始分辨率画面到浏览器下载目录。</div>
    </div>

    <div class="panel">
      <h2>文本输入</h2>
      <input type="text" id="text" placeholder="输入后回车发送">
      <div class="hint">点击 = 点按，按住 = 长按，拖动 = 跟手拖动/滑动，Alt(Option)/Ctrl + 拖动 = 双指缩放，滚轮 = 滚动。<br>
        点一下画面后可直接打字：字母数字与回车、退格、方向键直通设备，Esc = 返回，Ctrl/⌘+字母 = 组合键；
        中文请用上面的输入框（经设备剪贴板粘贴）。</div>
    </div>

    <div class="panel">
      <h2>设备剪贴板</h2>
      <pre class="clip" id="devclip">（空）</pre>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="clipget">读取</button>
        <button id="clipcopy" disabled>复制到本机</button>
        <button id="clippaste">本机剪贴板 → 设备</button>
      </div>
      <div class="hint">画面聚焦时 Ctrl/⌘+C 取设备剪贴板，Ctrl/⌘+V 把本机剪贴板粘贴进设备；设备上复制文字会自动同步到这里。</div>
    </div>
  </div>
</div>
<div id="flash"></div>

<script>
const $ = s => document.querySelector(s);
const id = decodeURIComponent(location.pathname.split('/').pop());
$('#title').textContent = id;

const cv = $('#cv'), ctx = cv.getContext('2d', {alpha:false});
// base 存最近一帧的原始画面，可见 canvas = base + 涟漪叠加层。
// 分两层是因为涟漪要在画面静止时也能动（长按时设备根本不出帧），
// 导出截图时也能拿到不带涟漪的干净帧。
const base = document.createElement('canvas');
base.width = cv.width; base.height = cv.height;
const bctx = base.getContext('2d', {alpha:false});
let devW = 1366, devH = 768, lease = null;

function flash(msg, isErr){
  const f = $('#flash'); f.textContent = msg; f.className = 'show' + (isErr ? ' err' : '');
  setTimeout(() => f.className = '', 1400);
}
function setLive(on, txt){
  const el = $('#live');
  el.className = 'live' + (on ? ' on' : '');
  el.querySelector('.txt').textContent = txt || (on ? '实时' : '画面中断');
}
// 首帧到达前盖一层「连接中」，别让人对着黑框猜是没连上还是设备黑屏
// 遮罩只用于「确实没有画面」的状态：连接中、重连、已暂停、被接管。
// 画面静止不算——scrcpy 本来就只在变化时出帧，盖住一张好画面反而更糟（实测踩过）。
function loading(txt){ const l = $('#loading'); if(txt){ l.textContent = txt; l.hidden = false; } else l.hidden = true; }
function resize(w, h){
  if(!w || !h || (w === cv.width && h === cv.height)) return;
  cv.width = base.width = w; cv.height = base.height = h;
  devW = w; devH = h; loadInfo();
}
function paint(){ ctx.drawImage(base, 0, 0); drawRipples(); }

// —— HUD：fps / 码率 / 往返 / 解码积压 ——
let frames = 0, bytes = 0, lastFpsAt = performance.now(), rtt = null, lastFrameAt = 0;
// mode: 'ws' = WebSocket 双向通道（H.264 + 实时指针）；'mjpeg' = 截图流 + 每手势一次 POST 的退化路径
let decoder = null, mode = '', sock = null, streamAbort = null;

// —— H.264 解码：WebSocket 与 multipart 两条路都喂这里 ——
// 直接看 NAL 类型判断这一包是什么，不依赖服务端标志位的语义。
// Annex-B 起始码是 00 00 01 或 00 00 00 01，其后一字节的低 5 位是 NAL 类型：
//   7=SPS 8=PPS（只有参数集，不能当帧喂）  5=IDR（关键帧）  1=非 IDR 片
const nalTypes = b => {
  const t = new Set();
  for(let i = 0; i + 3 < b.length; i++){
    if(b[i] === 0 && b[i+1] === 0){
      let j = -1;
      if(b[i+2] === 1) j = i + 3;
      else if(b[i+2] === 0 && b[i+3] === 1) j = i + 4;
      if(j >= 0 && j < b.length){ t.add(b[j] & 0x1f); i = j; }
    }
  }
  return t;
};
// 建一个解码器，返回「喂一个访问单元」的函数
function newDecoder(){
  if(decoder){ try{ decoder.close(); }catch(_){} }
  const dec = decoder = new VideoDecoder({
    output: frame => {
      resize(frame.displayWidth, frame.displayHeight);
      bctx.drawImage(frame, 0, 0);
      frame.close();
      paint();
      loading(null);
      frames++; lastFrameAt = performance.now();
    },
    error: e => { setLive(false, '解码出错'); console.warn('VideoDecoder', e); }
  });
  // annexb：起始码就在数据里，不需要单独的 description
  dec.configure({codec: 'avc1.42E01E', optimizeForLatency: true, avc: {format: 'annexb'}});
  let paramSets = null, started = false, ts = 0;
  return bytes => {
    if(dec.state !== 'configured') return;
    const t = nalTypes(bytes);
    const hasIDR = t.has(5), hasSlice = t.has(1) || t.has(5);
    // 只含参数集的包不能当帧喂（解码器会报 "A key frame is required"），
    // 存起来，等下一个 IDR 拼在它前面一起送
    if(!hasSlice){
      if(t.has(7) || t.has(8)) paramSets = bytes;
      return;
    }
    if(!started){
      if(!hasIDR) return;            // 必须从 IDR 起步，之前的帧丢掉
      started = true;
    }
    let data = bytes;
    if(hasIDR && paramSets && !t.has(7)){
      // IDR 自己不带 SPS/PPS 时补上，否则解码器不知道分辨率等参数
      data = new Uint8Array(paramSets.length + bytes.length);
      data.set(paramSets); data.set(bytes, paramSets.length);
    }
    dec.decode(new EncodedVideoChunk({
      type: hasIDR ? 'key' : 'delta',
      timestamp: (ts += 33333),   // 设备 PTS 高位混着标志位，自己生成更可靠
      data
    }));
  };
}

// —— WebSocket 双向通道（首选）——
// 下行：二进制 = [标志位 1 字节][H.264 访问单元]，文本 = JSON 事件（hello / error / clip / pong）
// 上行：JSON 输入，指针 down/move/up 按发生顺序实时发，设备侧看到的就是一根真实的手指
function wsURL(){
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host +
    `/api/devices/${encodeURIComponent(id)}/ws`;
}
// 等到 hello 才算成功。hello 之前被关掉（未配 scrcpy、设备侧起不来）就 reject，
// 调用方退回截图流。
function startWS(){
  return new Promise((resolve, reject) => {
    const s = sock = new WebSocket(wsURL());
    s.binaryType = 'arraybuffer';
    const feed = newDecoder();
    let hello = false;
    s.onmessage = ev => {
      if(typeof ev.data === 'string'){
        let m; try{ m = JSON.parse(ev.data); }catch(_){ return; }
        if(m.t === 'hello'){
          hello = true; mode = 'ws';
          resize(m.w, m.h);
          setLive(true, '实时 H.264');
          // 重连时画布上通常还留着上一帧：静止的画面就是当前状态，盖住它反而看不见东西。
          // 只有从没出过帧（真的一片空白）才显示等待提示。
          if(!lastFrameAt) loading('等待首帧…');
          resolve(s);
        }else if(m.t === 'error'){
          flash('操作被拒: ' + m.msg, true);
        }else if(m.t === 'clip'){
          onDeviceClip(m.text);
        }else if(m.t === 'pong'){
          rtt = Math.round(performance.now() - m.ts);
        }
        return;
      }
      bytes += ev.data.byteLength;
      // 首字节是标志位；解码按 NAL 类型自行判断，不依赖它
      feed(new Uint8Array(ev.data, 1));
    };
    s.onclose = ev => {
      if(sock === s) sock = null;
      if(mode === 'ws') mode = '';   // 通道没了就回到 /input 的退化路径，别让按键静默失效
      pointers.clear(); slotMask = 0; rtt = null;
      if(s.superseded){ if(!hello) reject(new Error('superseded')); return; }  // 我们自己关的（暂停/换流）
      if(ev.reason === 'too_many_sessions'){
        // 名额满了：不退回截图流（那会再占一路 screencap），过会儿再试
        setLive(false, '实时通道已满'); loading('同时放大的设备已达上限，10 秒后重试…');
        if(!hello) reject(new Error('superseded'));
        setTimeout(startStream, 10000);
        return;
      }
      if(!hello){ reject(new Error(ev.reason || 'closed before hello')); return; }
      if(ev.reason === 'taken_over'){ setLive(false, '已被其他页面接管'); loading('已被其他页面接管'); return; }
      setLive(false, '流中断，重连中');
      if(!lastFrameAt) loading('流中断，重连中…');
      setTimeout(startStream, 1500);
    };
  });
}
function sendWS(o){
  if(mode === 'ws' && sock && sock.readyState === WebSocket.OPEN){ sock.send(JSON.stringify(o)); return true; }
  return false;
}

// —— screencap 路（退回）——
// 通用 multipart 流读取：把每个 part 的头与负载交给 onPart 处理。
async function readMultipart(url, signal, onPart){
  const res = await fetch(url, {signal});
  if(!res.ok) throw new Error(res.status);
  const reader = res.body.getReader();
  let buf = new Uint8Array(0);
  const concat = (a,b)=>{ const c=new Uint8Array(a.length+b.length); c.set(a); c.set(b,a.length); return c; };
  const find = (hay,needle,from=0)=>{
    outer: for(let i=from;i<=hay.length-needle.length;i++){
      for(let j=0;j<needle.length;j++) if(hay[i+j]!==needle[j]) continue outer;
      return i;
    }
    return -1;
  };
  const HDR_END = new TextEncoder().encode('\r\n\r\n');
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    buf = concat(buf, value);
    for(;;){
      const he = find(buf, HDR_END);
      if(he < 0) break;
      const header = new TextDecoder().decode(buf.subarray(0, he));
      const m = /Content-Length:\s*(\d+)/i.exec(header);
      if(!m){ buf = buf.subarray(he+4); continue; }
      const len = +m[1], start = he+4;
      if(buf.length < start+len) break;
      const bytes = buf.slice(start, start+len);
      buf = buf.subarray(start+len);
      await onPart(header, bytes);
    }
  }
}
async function startMJPEG(signal){
  await readMultipart(`/api/devices/${encodeURIComponent(id)}/stream.mjpg`, signal, async (header, bytes) => {
    const w = +(/X-Device-Width:\s*(\d+)/i.exec(header)?.[1] || 0);
    const h = +(/X-Device-Height:\s*(\d+)/i.exec(header)?.[1] || 0);
    const type = /Content-Type:\s*(\S+)/i.exec(header)?.[1] || 'image/jpeg';
    try{
      const bmp = await createImageBitmap(new Blob([bytes], {type}));
      resize(w, h);
      bctx.drawImage(bmp, 0, 0);
      bmp.close();
      paint();
      loading(null);
      frames++;
      setLive(true, window.isSecureContext ? '实时 截图流' : '截图流（http 非安全上下文，无 WebCodecs）');
    }catch(_){}
  });
}

async function startStream(){
  stopStream();
  loading('连接中…');
  if(typeof VideoDecoder !== 'undefined'){
    try{ await startWS(); return; }
    catch(e){
      if(e.message === 'superseded') return;
      // 通道不可用（未配 scrcpy-server、设备侧起不来）就退回截图流，
      // 慢但一定能用，不能让放大视图直接黑掉
      console.warn('WebSocket 通道不可用，退回截图流:', e.message);
    }
  }
  mode = 'mjpeg';
  streamAbort = new AbortController();
  // WebCodecs 只在安全上下文（HTTPS 或 localhost）里存在。用内网 IP 直接开 http://
  // 会静默落到截图流，操作人员不知道为什么只有 3 fps——把原因写在状态栏上。
  if(typeof VideoDecoder === 'undefined' && !window.isSecureContext)
    flash('当前是 http:// 非安全上下文，浏览器没有 WebCodecs，退回截图流；用 https 或 localhost 打开可得 H.264', true);
  try{
    await startMJPEG(streamAbort.signal);
    setLive(false, '流已结束');
  }catch(e){
    if(e.name === 'AbortError') return;
    setLive(false, '流中断，重连中');
    setTimeout(startStream, 1500);
  }
}
function stopStream(){
  if(sock){ const s = sock; sock = null; s.superseded = true; s.close(); }
  if(streamAbort){ streamAbort.abort(); streamAbort = null; }
  if(decoder){ try{ decoder.close(); }catch(_){} decoder = null; }
  mode = '';
}

function animate(){
  flushMoves();
  if(ripples.length) paint();
  const now = performance.now();
  if(now - lastFpsAt >= 1000){
    const parts = [];
    if(frames) parts.push(`${frames} fps`);
    else if(lastFrameAt) parts.push(`静止 ${Math.round((now - lastFrameAt) / 1000)} s`);
    if(bytes) parts.push(`${Math.round(bytes * 8 / 1000)} kbps`);
    if(rtt !== null) parts.push(`往返 ${rtt} ms`);
    const q = decoder && decoder.state === 'configured' ? decoder.decodeQueueSize : 0;
    if(q > 2) parts.push(`积压 ${q}`);
    $('#fpsnow').textContent = parts.join(' · ');
    frames = 0; bytes = 0; lastFpsAt = now;
    // 解码排队超过 3 秒的量说明浏览器跟不上，画面会越来越滞后；
    // scrcpy 没有「按需关键帧」，只能断开重连拿一个新的 IDR 从头来
    if(q > 30 && mode === 'ws'){ flash('解码积压，重连以追上实时画面', true); startStream(); }
    if(mode === 'ws') sendWS({t:'ping', ts: now});
  }
  requestAnimationFrame(animate);
}

// 点击涟漪：设备画面要几百毫秒后才反映出变化，没有即时反馈时
// 操作人员会以为没点上而重复点，造成误操作。涟漪在本地立刻画出来。
const ripples = [];
function addRipple(x, y, kind){ ripples.push({x, y, kind, t: performance.now()}); }
function drawRipples(){
  const now = performance.now();
  for(let i = ripples.length - 1; i >= 0; i--){
    const r = ripples[i], age = now - r.t;
    if(age > 600){ ripples.splice(i, 1); continue; }
    const p = age / 600;
    ctx.save();
    ctx.strokeStyle = r.kind === 'pending' ? `rgba(88,166,255,${1-p})` : `rgba(63,185,80,${1-p})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 8 + p * 34, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// canvas 内部像素 = 设备像素，只需按 CSS 显示尺寸换算
function toDevice(ev){
  const r = cv.getBoundingClientRect();
  return {
    x: Math.round((ev.clientX - r.left) / r.width * cv.width),
    y: Math.round((ev.clientY - r.top) / r.height * cv.height)
  };
}
// 捕获了指针之后拖出画面事件照样来，钳到边缘；服务端也会钳，这里钳是为了涟漪画在画面里
function clampDev(p){
  return {x: Math.max(0, Math.min(cv.width - 1, p.x)), y: Math.max(0, Math.min(cv.height - 1, p.y))};
}
// 双指缩放：以画面中心为对称点镜像出第二根手指（scrcpy 的 Ctrl+拖动就是这么做的）
function mirror(p){ return {x: cv.width - 1 - p.x, y: cv.height - 1 - p.y}; }

async function send(body){
  const r = await fetch(`/api/devices/${encodeURIComponent(id)}/input`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  if(!r.ok){ flash('操作失败: ' + r.status, true); return false; }
  return true;
}
// 有通道走通道，没有走 HTTP
async function input(wsMsg, httpBody){
  if(sendWS(wsMsg)) return true;
  return send(httpBody);
}

// —— 实时指针（ws 模式）——
// 每根浏览器指针占一个 0~9 的槽位作为设备侧 pointer id；Alt/Ctrl 按下时再占一个槽位
// 当镜像手指。move 先攒着，在每个动画帧统一发一次：高刷屏一秒几百条 pointermove，
// 设备那边 60 Hz 足够，多发只是排队。
const pointers = new Map();   // e.pointerId → {slot, virt, last, pending, trail}
let slotMask = 0;
function allocSlot(){ for(let i = 0; i < 10; i++) if(!(slotMask & (1 << i))){ slotMask |= 1 << i; return i; } return -1; }
function freeSlot(i){ if(i >= 0) slotMask &= ~(1 << i); }
function touch(a, slot, p){ sendWS({t:'touch', a, id:slot, x:p.x, y:p.y}); }
function flushMoves(){
  for(const rec of pointers.values()){
    const p = rec.pending;
    if(!p) continue;
    rec.pending = null;
    if(p.x === rec.last.x && p.y === rec.last.y) continue;
    rec.last = p;
    touch('move', rec.slot, p);
    if(rec.virt >= 0) touch('move', rec.virt, mirror(p));
    if(Math.hypot(p.x - rec.trail.x, p.y - rec.trail.y) > 24){ rec.trail = p; addRipple(p.x, p.y, 'pending'); }
  }
}
function endPointer(e, cancelled){
  const rec = pointers.get(e.pointerId);
  if(!rec) return;
  pointers.delete(e.pointerId);
  // pointercancel 没有可信坐标，用最后一个位置；否则先把攒着的 move 发掉再抬起
  let p = cancelled ? rec.last : clampDev(toDevice(e));
  if(!cancelled && rec.pending && (rec.pending.x !== rec.last.x || rec.pending.y !== rec.last.y)){
    touch('move', rec.slot, rec.pending);
    if(rec.virt >= 0) touch('move', rec.virt, mirror(rec.pending));
  }
  touch('up', rec.slot, p);
  if(rec.virt >= 0){ touch('up', rec.virt, mirror(p)); freeSlot(rec.virt); }
  freeSlot(rec.slot);
  addRipple(p.x, p.y, 'done');
}

// —— 退化路径（mjpeg 模式）：松手后才判断是点还是滑，交给 /input 回放 ——
let down = null;

cv.addEventListener('pointerdown', e => {
  // setPointerCapture 在某些情况下会抛（合成事件、指针已释放），
  // 抛出来会中断整个处理函数，点击静默失效。捕获只是锦上添花，失败不该阻断操作。
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  e.preventDefault();
  cv.focus({preventScroll:true});   // 点过画面后键盘就直通设备
  const p = clampDev(toDevice(e));
  if(mode !== 'ws'){
    down = {...p, t: Date.now()};
    addRipple(p.x, p.y, 'pending');
    return;
  }
  const pinch = e.altKey || e.ctrlKey;
  if(e.button !== 0 && !pinch) return;   // 右键/中键暂无语义；Mac 上 Ctrl+点击是 button 2，按缩放处理
  const slot = allocSlot();
  if(slot < 0) return;
  const rec = {slot, virt: pinch ? allocSlot() : -1, last: p, pending: null, trail: p};
  pointers.set(e.pointerId, rec);
  touch('down', slot, p);
  addRipple(p.x, p.y, 'pending');
  if(rec.virt >= 0){ const m = mirror(p); touch('down', rec.virt, m); addRipple(m.x, m.y, 'pending'); }
});
cv.addEventListener('pointermove', e => {
  if(mode === 'ws'){
    const rec = pointers.get(e.pointerId);
    if(rec) rec.pending = clampDev(toDevice(e));
    return;
  }
  if(!down) return;
  const p = toDevice(e);
  if(Math.hypot(p.x - down.x, p.y - down.y) > 12) addRipple(p.x, p.y, 'pending');
});
cv.addEventListener('pointerup', async e => {
  if(mode === 'ws'){ endPointer(e, false); return; }
  if(!down) return;
  const up = toDevice(e), from = down;
  down = null;
  const dist = Math.hypot(up.x - from.x, up.y - from.y);
  const dt = Date.now() - from.t;
  if(dist > 12){
    addRipple(up.x, up.y, 'done');
    if(await send({type:'swipe', x:from.x, y:from.y, x2:up.x, y2:up.y, ms:Math.max(120, Math.min(dt, 1200))}))
      flash(`滑动 ${from.x},${from.y} → ${up.x},${up.y}`);
  }else{
    if(await send({type:'tap', x:up.x, y:up.y})){
      addRipple(up.x, up.y, 'done');       // 服务端确认后再补一圈绿的
      flash(`点击 ${up.x},${up.y}`);
    }
  }
});
cv.addEventListener('pointercancel', e => { if(mode === 'ws') endPointer(e, true); else down = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());   // Ctrl+点击 / 右键不要弹菜单

let wheelLock = false;
cv.addEventListener('wheel', async e => {
  e.preventDefault();
  const p = clampDev(toDevice(e));
  if(mode === 'ws'){
    // 转成 Android AXIS_*SCROLL 的 [-1,1]：像素模式一格约 100px，行模式一格 3 行，页模式 1 页。
    // 浏览器 deltaY 向下为正，Android vscroll 向上为正，所以取反；横向同向。
    const k = e.deltaMode === 1 ? 1 / 3 : e.deltaMode === 2 ? 1 : 1 / 100;
    const dx = Math.max(-1, Math.min(1, e.deltaX * k)), dy = Math.max(-1, Math.min(1, -e.deltaY * k));
    if(dx || dy) sendWS({t:'scroll', x:p.x, y:p.y, dx, dy});
    return;
  }
  if(wheelLock) return;
  wheelLock = true;
  const dy = e.deltaY > 0 ? -300 : 300;   // 滚轮向下 = 内容上移
  addRipple(p.x, p.y, 'pending');
  await send({type:'swipe', x:p.x, y:p.y, x2:p.x, y2:Math.max(0, Math.min(cv.height, p.y + dy)), ms:200});
  setTimeout(() => wheelLock = false, 240);
}, {passive:false});

// —— 物理键盘直通（画面聚焦时）——
// 特殊键按 Android keycode 直接注入（带修饰键），可打印字符走 text（服务端按 ASCII 与否选路）。
// IME 组合中的按键（key === 'Process' / isComposing）不管：中文走输入框。
const KEYCODES = {Enter:66, Backspace:67, Delete:112, Tab:61, Escape:4, ArrowUp:19, ArrowDown:20,
  ArrowLeft:21, ArrowRight:22, Home:122, End:123, PageUp:92, PageDown:93, ' ':62};
// Android META_* 位：SHIFT 0x1|0x40，ALT 0x2|0x10，CTRL 0x1000|0x2000，META 0x10000|0x20000
function metaOf(e){
  let m = 0;
  if(e.shiftKey) m |= 0x41;
  if(e.altKey) m |= 0x12;
  if(e.ctrlKey || e.metaKey) m |= 0x3000;   // Mac 的 ⌘ 当 Ctrl 用，Ctrl+A/C/V/X/Z 才有意义
  return m;
}
// 字母/数字在 Android 的 keycode：A=29…Z=54，0=7…9=16
function letterCode(k){
  if(/^[a-z]$/i.test(k)) return 29 + (k.toLowerCase().charCodeAt(0) - 97);
  if(/^[0-9]$/.test(k)) return 7 + (k.charCodeAt(0) - 48);
  return null;
}
function keyevPair(code, meta){
  sendWS({t:'keyev', a:'down', code, meta});
  sendWS({t:'keyev', a:'up', code, meta});
}
cv.addEventListener('keydown', async e => {
  if(mode !== 'ws' || e.isComposing || e.key === 'Process') return;
  const combo = e.ctrlKey || e.metaKey;
  if(combo && /^[cv]$/i.test(e.key)){
    // 剪贴板双向：⌘/Ctrl+C 取设备剪贴板，⌘/Ctrl+V 把本机剪贴板粘进设备
    e.preventDefault();
    if(e.key.toLowerCase() === 'c') sendWS({t:'getclip', copy:true});
    else pasteToDevice();
    return;
  }
  if(e.key in KEYCODES){
    e.preventDefault();
    keyevPair(KEYCODES[e.key], metaOf(e));
    return;
  }
  const lc = letterCode(e.key);
  if(combo && lc !== null){ e.preventDefault(); keyevPair(lc, metaOf(e)); return; }
  if(e.key.length === 1 && !combo){
    e.preventDefault();
    sendWS({t:'text', text:e.key});   // 逐字符打字，和真键盘一样
  }
});

// —— 设备剪贴板 ——
let devClip = '';
function onDeviceClip(text){
  devClip = text || '';
  $('#devclip').textContent = devClip || '（空）';
  $('#clipcopy').disabled = !devClip;
  // 由 ⌘/Ctrl+C 触发时用户手势还在有效期内，顺手写进本机剪贴板；失败就留在面板里
  if(devClip && navigator.clipboard) navigator.clipboard.writeText(devClip).then(() => flash('设备剪贴板已复制到本机')).catch(() => {});
}
async function pasteToDevice(){
  try{
    const text = await navigator.clipboard.readText();
    if(!text){ flash('本机剪贴板是空的', true); return; }
    if(sendWS({t:'clip', text, paste:true})) flash(`已粘贴 ${text.length} 字`);
  }catch(_){ flash('读不到本机剪贴板（需 HTTPS 且授权）', true); }
}
$('#clipget').onclick = () => { if(!sendWS({t:'getclip', copy:false})) flash('实时通道未连接', true); };
$('#clipcopy').onclick = () => navigator.clipboard.writeText(devClip).then(() => flash('已复制到本机')).catch(() => flash('复制失败（需 HTTPS）', true));
$('#clippaste').onclick = pasteToDevice;

document.querySelectorAll('[data-key]').forEach(b => {
  b.onclick = async () => {
    const key = b.dataset.key;
    if(await input({t:'key', key}, {type:'key', key})) flash('按键 ' + (b.title || key));
  };
});
$('#text').addEventListener('keydown', async e => {
  if(e.key !== 'Enter' || e.isComposing) return;
  const v = e.target.value;
  if(!v) return;
  if(await input({t:'text', text:v}, {type:'text', text:v})){ flash('已输入'); e.target.value = ''; }
});

// 截图：base 里就是原始分辨率、不带涟漪的那一帧
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
$('#snap').onclick = () => {
  base.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `${id}-${stamp()}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flash('已保存 ' + a.download);
  }, 'image/png');
};
$('#copy').onclick = () => {
  base.toBlob(async b => {
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
      flash('已复制到剪贴板');
    }catch(e){ flash('复制失败（需 HTTPS 或 localhost）', true); }
  }, 'image/png');
};

async function loadInfo(){
  try{
    const j = await (await fetch('/api/wall')).json();
    const d = (j.devices||[]).find(x => x.id === id);
    if(!d) return;
    lease = d.lease_id || null;
    $('#info').innerHTML = `
      <dt>状态</dt><dd>${d.state}</dd>
      <dt>adb</dt><dd>${d.adb_addr}</dd>
      <dt>分辨率</dt><dd>${devW}×${devH}</dd>
      ${d.worktree ? `<dt>worktree</dt><dd>${d.worktree}</dd>
      <dt>分支</dt><dd>${d.branch||''} ${d.head_sha||''}</dd>
      <dt>持有者</dt><dd>${d.owner||''}</dd>` : '<dt>租约</dt><dd>空闲</dd>'}
      ${d.human ? `<dt>接管</dt><dd style="color:var(--busy)">进行中 ${d.note||''}</dd>` : ''}`;
    $('#takeover').textContent = d.human ? '交还' : '接管';
    $('#takeover').disabled = !lease;
    $('#release').disabled = !lease;
    $('#takeover').dataset.on = d.human ? '1' : '';
  }catch(_){}
}

$('#takeover').onclick = async () => {
  if(!lease) return;
  const on = !$('#takeover').dataset.on;
  const r = await fetch(`/api/leases/${encodeURIComponent(lease)}/human`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({takeover: on, note: on ? '设备墙人工接管' : ''})
  });
  flash(r.ok ? (on ? '已接管，agent 应停手' : '已交还') : '操作失败', !r.ok);
  loadInfo();
};
$('#release').onclick = async () => {
  if(!lease || !confirm('强制释放这台设备？持有它的 agent 会失去设备。')) return;
  const r = await fetch(`/api/leases/${encodeURIComponent(lease)}`, {method:'DELETE'});
  flash(r.ok ? '已释放' : '释放失败', !r.ok);
  loadInfo();
};

// 租约变更走 SSE，不必轮询
const es = new EventSource('/api/events');
['snapshot','tick','claim','release','human','reap'].forEach(k => es.addEventListener(k, loadInfo));

// 页面隐藏时断流，别让后台标签页一直占着节点 CPU 和设备的编码器
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    stopStream();
    setLive(false, '已暂停'); loading('已暂停（切回标签页恢复）');
  } else if(!sock && !streamAbort){
    startStream();
  }
});

startStream(); loadInfo(); requestAnimationFrame(animate);
</script>
</body>
