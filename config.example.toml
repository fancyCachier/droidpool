# droidpoold 配置示例。控制面跑在 devopt（192.168.14.32），节点只跑 docker。
listen  = "0.0.0.0:8600"
token   = "换成一个随机串"          # agent 与设备墙共用
db_path = "/var/lib/droidpool/droidpool.db"

default_ttl    = "4h"
max_ttl        = "24h"
warm_pool      = 2
# 节点 swap 超过此值即拒绝新 claim。Phase 1 实测 swap 从 0 变正就是性能断崖
# （N=12 起失败率 5.6%、p95 冲到 2.66×），CPU 与温度都没有预警价值。
swap_guard_mib = 256

# 设备墙的 HTTPS 入口（可选）。WebCodecs 只在安全上下文（HTTPS / localhost）里存在，
# 用 http://内网IP 打开只有 3 fps 截图流。证书文件换新后自动生效，不用重启；
# wall_url 设了之后 http 上打开的设备墙页面会 302 过去，API 不受影响。
# [tls]
# listen   = "0.0.0.0:443"
# cert     = "/opt/droidpool/tls/fullchain.pem"
# key      = "/opt/droidpool/tls/privkey.pem"
# wall_url = "https://droidpool.example.com"

[edge_default]
host = "192.168.14.53"
port = 8090

[[nodes]]
name        = "3588-a"
docker_host = "ssh://sa@192.168.14.54"
port_range  = [5561, 5576]
# 实测活跃并发上限 10 台，取 8 留余量给设备墙截图与人工放大的 scrcpy
max_devices = 8
data_root   = "/data/droidpool"
# 分辨率与密度 = 收银机实机 Sunmi D1s 2nd 实测（1366×768 @ 160 dpi）
# use_memfd 不可省：.54 内核无 ashmem
# 公网出口：打开后每台设备多起两个辅助容器（tun 边车 + socks5 中继），
# 公网流量经中继落地、内网（Edge/adb/控制面）始终直连；
# 具体出口地址每台设备在设备墙上单独设，运行中可改且不中断租约。
# 前提：节点上要有 tun 模块（modprobe tun，并写进 /etc/modules-load.d/）。
egress     = false
egress_dns = "223.5.5.5"
# 摄像头：非 0 时每台设备透传 /dev/video<base+序号>（3588-a-1 → /dev/video21）。
# 一台一个节点，共用的话谁先打开谁独占。需要自建镜像（device/redroid-patches）
# 与节点上的 v4l2loopback（deploy/node/setup-node.sh），画面用 rtsp-camera.sh 灌。
camera_video_base = 0
boot_args = "androidboot.use_memfd=true androidboot.use_redroid_overlayfs=1 androidboot.redroid_width=1366 androidboot.redroid_height=768 androidboot.redroid_dpi=160 androidboot.redroid_gpu_mode=guest"

# --- watchdog：防止 agent 僵死后一直占着机器 ---
# 三道闸各管一种失效：
#   default_ttl  约定的租期，到点回收
#   idle_timeout 久未活动即判僵死（抓僵死的主力，比 TTL 快得多）
#   max_lifetime 持有总时长硬上限，兜住「一直心跳但其实卡死」
idle_timeout  = "30m"
max_lifetime  = "24h"
reap_interval = "1m"
